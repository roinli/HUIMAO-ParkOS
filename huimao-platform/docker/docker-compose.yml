version : '3.8'
networks:
  cloud-net:
    name: cloud-net
    ipam:
      config:
        - subnet: 172.18.0.0/16
services:
  huimao-nacos:
    container_name: huimao-nacos
    build:
      context: ./nacos
    environment:
      - MODE=standalone
      - MYSQL_HOST=huimao-mysql
      - MYSQL_USER=root
      - MYSQL_PWD=password
    volumes:
      - ./nacos/logs/:/home/huimao/logs
      # 通过环境变量配置数据库相关信息
      #- ./nacos/conf/bootstrap.yml:/home/huimao/conf/bootstrap.yml
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - huimao-mysql
    networks:
      cloud-net:
        ipv4_address: 172.18.0.6
  huimao-mysql:
    container_name: huimao-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
      - ./mysql/db:/docker-entrypoint-initdb.d
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1'
    ]
    environment:
      MYSQL_DATABASE: 'huimao_platform'
      MYSQL_ROOT_PASSWORD: password
    networks:
      cloud-net:
        ipv4_address: 172.18.0.2
  huimao-redis:
    container_name: huimao-redis
    image: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/home/huimao/redis/redis.conf
      - ./redis/data:/data
    command: redis-server /home/huimao/redis/redis.conf
    networks:
      cloud-net:
        ipv4_address: 172.18.0.3
  huimao-nginx:
    container_name: huimao-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/html/dist:/home/huimao/projects/huimao-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - huimao-gateway
    links:
      - huimao-gateway
    networks:
      cloud-net:
        ipv4_address: 172.18.0.4
  huimao-gateway:
    container_name: huimao-gateway
    build:
      context: huimao/gateway
      dockerfile: dockerfile
    ports:
      - "38080:38080"
    depends_on:
      - huimao-redis
    links:
      - huimao-redis
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.5
    networks:
      cloud-net:
        ipv4_address: 172.18.0.5
  huimao-auth:
    container_name: huimao-auth
    build:
      context: huimao/auth
      dockerfile: dockerfile
    ports:
      - "39200:39200"
    depends_on:
      - huimao-redis
    links:
      - huimao-redis
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.7
    networks:
      cloud-net:
        ipv4_address: 172.18.0.7
  huimao-system:
    container_name: huimao-system
    build:
      context: huimao/modules/system
      dockerfile: dockerfile
    ports:
      - "39201:39201"
    depends_on:
      - huimao-redis
      - huimao-mysql
    links:
      - huimao-redis
      - huimao-mysql
      - huimao-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.8
    networks:
      cloud-net:
        ipv4_address: 172.18.0.8
  huimao-gen:
    container_name: huimao-gen
    build:
      context: huimao/modules/gen
      dockerfile: dockerfile
    ports:
      - "39202:39202"
    depends_on:
      - huimao-mysql
    links:
      - huimao-mysql
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.9
    networks:
      cloud-net:
        ipv4_address: 172.18.0.9
  huimao-file:
    container_name: huimao-file
    build:
      context: huimao/modules/file
      dockerfile: dockerfile
    ports:
      - "39300:39300"
    volumes:
      - ./huimao/uploadPath:/home/huimao/uploadPath
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.10
    networks:
      cloud-net:
        ipv4_address: 172.18.0.10
  huimao-monitor:
    container_name: huimao-monitor
    build:
      context: huimao/visual/monitor
      dockerfile: dockerfile
    ports:
      - "39100:39100"
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.11
    networks:
      cloud-net:
        ipv4_address: 172.18.0.11
  huimao-demo:
    container_name: huimao-demo
    build:
      context: huimao/demo
      dockerfile: dockerfile
    ports:
      - "39203:39203"
    depends_on:
      - huimao-redis
      - huimao-mysql
    links:
      - huimao-redis
      - huimao-mysql
      - huimao-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.12
    networks:
      cloud-net:
        ipv4_address: 172.18.0.12
  huimao-job:
    container_name: huimao-job
    build:
      context: huimao/modules/job
      dockerfile: dockerfile
    ports:
      - "39204:39204"
    depends_on:
      - huimao-redis
      - huimao-mysql
    links:
      - huimao-redis
      - huimao-mysql
      - huimao-file
    environment:
      - NACOS_HOST=172.18.0.6
      - NACOS_PORT=8848
      - NETWORK_IP=172.18.0.13
    networks:
      cloud-net:
        ipv4_address: 172.18.0.13
